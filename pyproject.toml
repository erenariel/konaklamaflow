[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "konaklamaflow"
version = "0.2.0rc1"
description = "Privacy-first dry-run hospitality operations reviewer for boutique hotels"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "erenariel"}]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License", "Topic :: Office/Business"]

[project.scripts]
konaklamaflow = "konaklamaflow.cli:main"
konaklamaflow-ops = "konaklamaflow.ops_cli:main"
konaklamaflow-suite = "konaklamaflow.experience_cli:main"

[project.optional-dependencies]
browser = ["playwright==1.62.0"]

[tool.setuptools.packages.find]
include = ["konaklamaflow*"]
