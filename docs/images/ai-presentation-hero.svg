<g class="stage1"><rect x="298" y="239" width="122" height="44" rx="11" fill="#3EECC9" fill-opacity=".22" stroke="#3EECC9" stroke-opacity=".9"/><text x="310" y="265" class="stage">01  SOURCE</text></g><g class="stage2"><rect x="436" y="239" width="122" height="44" rx="11" fill="#719CFF" fill-opacity=".22" stroke="#719CFF" stroke-opacity=".9"/><text x="448" y="265" class="stage">02  RULES</text></g><g class="stage3"><rect x="574" y="239" width="122" height="44" rx="11" fill="#B28BFF" fill-opacity=".22" stroke="#B28BFF" stroke-opacity=".9"/><text x="586" y="265" class="stage">03  INSIGHT</text></g><g class="stage4"><rect x="712" y="239" width="122" height="44" rx="11" fill="#F5BD72" fill-opacity=".22" stroke="#F5BD72" stroke-opacity=".9"/><text x="724" y="265" class="stage">04  STAFF</text></g>
<rect x="281" y="321" width="581" height="6" rx="3" fill="#174D64"/>
<rect x="281" y="321" width="174" height="6" rx="3" fill="url(#accent)" class="sweep"/>
