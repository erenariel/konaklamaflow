<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="heroTitle heroDescription">
<title id="heroTitle">KonaklamaFlow — animated AI operations concept</title>
<desc id="heroDescription">Original illustrative visualization of a fictional offline hotel operations dashboard. Colored AI explanation stages, occupancy chart, room statuses and staff review are animated. No real hotel system is connected.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#08152B"/><stop offset=".53" stop-color="#102D54"/><stop offset="1" stop-color="#094B53"/></linearGradient>
  <linearGradient id="glass" x2=".9" y2="1"><stop stop-color="#1C4771"/><stop offset="1" stop-color="#123B53"/></linearGradient>
  <linearGradient id="accent"><stop stop-color="#47F0D3"/><stop offset=".55" stop-color="#6994FF"/><stop offset="1" stop-color="#AE83FA"/></linearGradient>
  <radialGradient id="orb"><stop stop-color="#3BE6D8" stop-opacity=".3"/><stop offset="1" stop-color="#3BE6D8" stop-opacity="0"/></radialGradient>
  <filter id="glow" x="-40%" y="-100%" width="180%" height="300%"><feGaussianBlur stdDeviation="5"/></filter>
  <style><![CDATA[
  .title{font-family:Arial,Helvetica,sans-serif;font-weight:800;font-size:27px;fill:#F7FCFF}
  .sub{font:14px Arial,Helvetica,sans-serif;fill:#BBD8E8}
  .tiny{font:700 11px Arial,Helvetica,sans-serif;letter-spacing:1.3px;fill:#71EAD4}
  .mini{font:12px Arial,Helvetica,sans-serif;fill:#C8E4F0}
  .stat{font:700 33px Arial,Helvetica,sans-serif;fill:#F5FBFF}
  .stage{font:700 12px Arial,Helvetica,sans-serif;fill:#E7F3FF}
  .blink{animation:blink 2.4s ease-in-out infinite}
  .sweep{animation:sweep 7s linear infinite}
  .sheen{animation:sheen 6s linear infinite}
  .stage1{animation:stage1 8s ease-in-out infinite}
  .stage2{animation:stage2 8s ease-in-out infinite}
  .stage3{animation:stage3 8s ease-in-out infinite}
  .stage4{animation:stage4 8s ease-in-out infinite}
  @keyframes blink{0%,100%{opacity:.6}50%{opacity:1}}
  @keyframes sweep{0%{transform:translateX(-500px);opacity:0}8%,82%{opacity:.8}100%{transform:translateX(900px);opacity:0}}
  @keyframes sheen{0%,100%{opacity:.18}50%{opacity:.5}}
  @keyframes stage1{0%,19%{opacity:1}26%,100%{opacity:.35}}
  @keyframes stage2{0%,24%{opacity:.35}25%,44%{opacity:1}51%,100%{opacity:.35}}
  @keyframes stage3{0%,49%{opacity:.35}50%,69%{opacity:1}76%,100%{opacity:.35}}
  @keyframes stage4{0%,74%{opacity:.35}75%,100%{opacity:1}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  ]]></style>
</defs>
