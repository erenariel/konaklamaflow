name: one-off refresh source-bound review demo media
on:
  push:
    branches: [fix/review-panel-source-clarity-20261113]
    paths:
      - .github/workflows/refresh-review-media-once.yml
permissions:
  contents: write
jobs:
  regenerate:
    if: github.repository == 'erenariel/konaklamaflow'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline media tools
        run: |
          python -m pip install -e '.[browser]'
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Regenerate real screenshots and scenario GIFs from committed HTML
        run: |
          python scripts/capture_previews.py
          python scripts/build_promo_gifs.py
      - name: Verify Python, browser, provenance and generated fixtures
        run: |
          python -m unittest discover -s tests -v
          python -m unittest discover -s tests/browser -v
          python scripts/generate_hotel_ops_demo.py --check
          python scripts/generate_suite_demo.py --check
      - name: Commit updated source-bound media to PR branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/images
          if git diff --cached --quiet; then
            echo 'No visual changes'
          else
            git commit -m 'docs(media): refresh provenance for precomputed Python review panel'
            git push origin HEAD:refs/heads/fix/review-panel-source-clarity-20261113
          fi
