name: Aurora timeline one-off media regeneration
on:
  push:
    branches: [feat/aurora-timeline-filters-20261114]
    paths: ['.github/workflows/aurora-timeline-media.yml']

permissions:
  contents: write

concurrency:
  group: aurora-timeline-media-regeneration
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser and media tooling
        run: |
          python -m pip install -e '.[browser]'
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Validate canonical generated sources
        run: |
          python scripts/generate_suite_demo.py --check
          python scripts/generate_hotel_ops_demo.py --check
          python scripts/generate_canonical_demo.py --check
          node --check demo/aurora-timeline.js
      - name: Capture real offline app media
        run: |
          python scripts/capture_previews.py
          python scripts/record_demo_tour.py
          python scripts/build_promo_gifs.py
      - name: Verify complete source-bound media, functionality and visuals
        run: |
          python -m unittest discover -s tests -v
          python -m unittest discover -s tests/browser -v
          python scripts/verify_demo_experience.py --output /tmp/aurora-timeline-audit
      - name: Commit only updated generated media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images/
          if ! git diff --cached --quiet; then
            git commit -m "docs(media): refresh source-bound Aurora timeline browser captures"
            git push origin HEAD:feat/aurora-timeline-filters-20261114
          fi
