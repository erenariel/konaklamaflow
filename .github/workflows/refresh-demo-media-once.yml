name: one-off regenerate offline demo media
on:
  push:
    branches: [fix/demo-mobile-locale-20261113]
    paths:
      - .github/workflows/refresh-demo-media-once.yml
permissions:
  contents: write
jobs:
  regenerate:
    if: github.repository == 'erenariel/konaklamaflow'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium, ffmpeg and optional browser tools
        run: |
          python -m pip install -e '.[browser]'
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Record the actual current offline HTML, no external requests
        run: |
          python scripts/capture_previews.py
          python scripts/build_promo_gifs.py
      - name: Verify recorded media and full browser regression
        run: |
          python -m unittest discover -s tests -v
          python -m unittest discover -s tests/browser -v
          python scripts/generate_hotel_ops_demo.py --check
          python scripts/generate_suite_demo.py --check
      - name: Publish regenerated media on this isolated PR branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/images
          if git diff --cached --quiet; then
            echo 'No media changes'
          else
            git commit -m 'docs(media): refresh screenshots and GIF provenance for mobile locale fix'
            git push origin HEAD:refs/heads/fix/demo-mobile-locale-20261113
          fi
