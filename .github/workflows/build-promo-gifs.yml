name: Generate presentation GIFs (promo branch only)
on:
  push:
    branches:
      - docs/motion-promo-visuals-20261113
    paths:
      - scripts/build_promo_gifs.py
      - .github/workflows/build-promo-gifs.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture-and-commit:
    if: github.ref == 'refs/heads/docs/motion-promo-visuals-20261113'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout promotion branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout approved synthetic AI demo from sibling PR branch
        uses: actions/checkout@v4
        with:
          repository: erenariel/konaklamaflow
          ref: feat/ai-operations-dashboard-desktop-v052
          path: .promo-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare offline Chromium capture dependencies
        run: |
          python -m pip install pillow playwright
          python -m playwright install --with-deps chromium
      - name: Render three GIFs from fictional local HTML
        run: |
          python scripts/build_promo_gifs.py --html .promo-source/demo/v04-integrated-preview.html --out docs/images
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          expectations = {'ai-command-tour.gif':15,'roomplan-story.gif':15,'overview-pulse.gif':20}
          for name, count in expectations.items():
              path = Path('docs/images')/name
              with Image.open(path) as gif:
                  assert gif.n_frames == count, (name, gif.n_frames)
                  assert gif.info.get('loop') == 0, name
              print(name, path.stat().st_size, 'bytes', count, 'frames')
          PY
      - name: Commit binary media to this promotion branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/images/ai-command-tour.gif docs/images/roomplan-story.gif docs/images/overview-pulse.gif
          if ! git diff --cached --quiet; then
            git commit -m 'docs(promo): render the three approved synthetic GIF tours [skip ci]'
            git push origin HEAD:docs/motion-promo-visuals-20261113
          fi
