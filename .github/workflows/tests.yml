name: tests
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Check commit privacy and Python syntax
        run: |
          python scripts/verify_commit_privacy.py
          python -m compileall -q konaklamaflow scripts
      - name: Run fictional demo
        run: python -m konaklamaflow examples/demo.json --as-of 2026-11-12 --output /tmp/report.json
      - name: Check operations and suite fixtures
        run: |
          python -m konaklamaflow.ops_cli examples/operations-demo.json --as-of 2026-11-12 --at-time 14:01 --output /tmp/ops-report.json
          python -m konaklamaflow.experience_cli examples/fictional-hotel.json /tmp/suite-report.json
          python scripts/generate_suite_demo.py --check
          python scripts/generate_hotel_ops_demo.py --check
          node --check demo/hotel-ops-module.js
          node --check demo/full-ui-i18n.js
          node --check demo/full-ui-i18n-catalog.js
          node --check demo/full-ui-lexicon.js
          node --check demo/hotel-workflow-ui.js
          python scripts/stage_demo_site.py --output /tmp/demo-site

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[browser]'
      - run: python -m playwright install --with-deps chromium
      - name: Check offline viewer and report imports
        run: python -m unittest discover -s tests/browser -v
      - name: Verify themes, modes and offline screenshots
        run: python scripts/verify_demo_experience.py --output /tmp/demo-experience
      - name: Preserve visual verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-experience-${{ github.sha }}
          path: /tmp/demo-experience
          if-no-files-found: error
          retention-days: 14
      - name: Downloadable v0.4 offline preview (synthetic data only)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: konaklamaflow-v04-preview-${{ github.sha }}
          path: demo/v04-integrated-preview.html
          if-no-files-found: error
          retention-days: 14
      - name: Preserve current v0.5.2 showcase media and provenance
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: konaklamaflow-v052-showcase-${{ github.sha }}
          path: |
            docs/images/ai-command-tour*
            docs/images/roomplan-story*
            docs/images/overview-pulse*
            docs/images/v052-*
          if-no-files-found: error
          retention-days: 14
