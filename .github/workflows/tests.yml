name: tests
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Generate offline truth-labeled benchmark evidence
        run: |
          python -m konaklamaflow.evaluation --json /tmp/konaklamaflow-eval.json --markdown /tmp/konaklamaflow-eval.md
          cat /tmp/konaklamaflow-eval.md >> "$GITHUB_STEP_SUMMARY"
      - name: Generate transparent 43-case synthetic benchmark v2
        run: |
          python -m konaklamaflow.evaluation_v2 --json /tmp/konaklamaflow-eval-v2.json --markdown /tmp/konaklamaflow-eval-v2.md
          cat /tmp/konaklamaflow-eval-v2.md >> "$GITHUB_STEP_SUMMARY"
      - name: Generate and verify fictional decision trace
        run: |
          python -m konaklamaflow.trace_cli --output /tmp/konaklamaflow-trace.json
          python -m konaklamaflow.trace_cli --verify /tmp/konaklamaflow-trace.json
      - name: Retain offline synthetic verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-offline-evidence-${{ matrix.python-version }}-${{ github.sha }}
          path: |
            /tmp/konaklamaflow-eval.json
            /tmp/konaklamaflow-eval.md
            /tmp/konaklamaflow-eval-v2.json
            /tmp/konaklamaflow-eval-v2.md
            /tmp/konaklamaflow-trace.json
          if-no-files-found: warn
          retention-days: 14
      - name: Check commit privacy and Python syntax
        run: |
          python scripts/verify_commit_privacy.py
          python -m compileall -q konaklamaflow scripts
      - name: Run fictional demo
        run: python -m konaklamaflow examples/demo.json --as-of 2026-11-12 --output /tmp/report.json
      - name: Check operations and suite fixtures
        run: |
          python -m konaklamaflow.ops_cli examples/operations-demo.json --as-of 2026-11-12 --at-time 14:01 --output /tmp/ops-report.json
          python -m konaklamaflow.experience_cli examples/fictional-hotel.json /tmp/suite-report.json
          python scripts/generate_suite_demo.py --check
          python scripts/generate_hotel_ops_demo.py --check
          python scripts/generate_canonical_demo.py --check
          node --check demo/canonical-navigation.js
          node --check demo/aurora-room-plan.js
          node --check demo/aurora-timeline.js
          node --check demo/aurora-room-i18n.js
          node --check demo/hotel-ops-module.js
          node --check demo/full-ui-i18n.js
          node --check demo/full-ui-i18n-catalog.js
          node --check demo/full-ui-lexicon.js
          node --check demo/hotel-workflow-ui.js
          node --check demo/decision-evidence-ui.js
          python -m scripts.render_scorecard --output /tmp/konaklamaflow-scorecard.html
          python -m scripts.render_scorecard --check /tmp/konaklamaflow-scorecard.html
          python -m scripts.render_trace_view --output /tmp/konaklamaflow-trace-view.html
          python -m scripts.render_trace_view --check /tmp/konaklamaflow-trace-view.html
          python scripts/stage_demo_site.py --output /tmp/demo-site
          test -s /tmp/demo-site/synthetic-scorecard.html
          test -s /tmp/demo-site/fictional-trace.html
          test -s /tmp/demo-site/project-overview.html
          test -s /tmp/demo-site/ai-command-tour-poster.png
          python -m scripts.verify_release_readiness --site /tmp/demo-site


  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[browser]'
      - run: python -m playwright install --with-deps chromium
      - name: Check offline viewer and report imports
        run: python -m unittest discover -s tests/browser -v
      - name: Verify themes, modes and offline screenshots
        run: python scripts/verify_demo_experience.py --output /tmp/demo-experience
      - name: Preserve visual verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-experience-${{ github.sha }}
          path: /tmp/demo-experience
          if-no-files-found: error
          retention-days: 14
      - name: Downloadable v0.4 offline preview (synthetic data only)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: konaklamaflow-v04-preview-${{ github.sha }}
          path: demo/v04-integrated-preview.html
          if-no-files-found: error
          retention-days: 14
      - name: Preserve current v0.5.2 showcase media and provenance
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: konaklamaflow-v052-showcase-${{ github.sha }}
          path: |
            docs/images/ai-command-tour*
            docs/images/roomplan-story*
            docs/images/overview-pulse*
            docs/images/v052-*
            docs/images/aurora-room-plan-*
          if-no-files-found: error
          retention-days: 14


  package:
    name: package (clean-wheel install)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*.whl dist/*.tar.gz
          sha256sum dist/*.whl dist/*.tar.gz > dist/SHA256SUMS
      - name: Clean offline wheel installation and command smoke test
        run: |
          python -m venv /tmp/kf-clean-env
          /tmp/kf-clean-env/bin/python -m pip install --no-index --no-deps dist/*.whl
          (cd /tmp && /tmp/kf-clean-env/bin/konaklamaflow demo --output /tmp/kf-wheel-demo.json)
          (cd /tmp && /tmp/kf-clean-env/bin/konaklamaflow review-csv \
            --rooms "$GITHUB_WORKSPACE/examples/csv/rooms.csv" \
            --reservations "$GITHUB_WORKSPACE/examples/csv/reservations.csv" \
            --as-of 2026-11-12 --output /tmp/kf-wheel-csv.json)
          /tmp/kf-clean-env/bin/python - <<'PY'
          import json
          from importlib.metadata import version
          from pathlib import Path
          assert version('konaklamaflow') == '0.2.0rc2'
          demo = json.loads(Path('/tmp/kf-wheel-demo.json').read_text())
          review = json.loads(Path('/tmp/kf-wheel-csv.json').read_text())
          assert demo['summary']['rooms'] == 5
          assert review['summary']['rooms'] == 3
          assert 'fictional@example.invalid' not in json.dumps(review)
          assert 'NOT_A_REAL_PASSPORT' not in json.dumps(review)
          assert demo['mode'] == 'DRY_RUN_ONLY'
          PY
      - name: Preserve verified candidate distributions (not a public release)
        uses: actions/upload-artifact@v4
        with:
          name: package-v0.2.0rc2-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
