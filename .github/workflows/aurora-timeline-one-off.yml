name: Aurora Timeline One-Off Media Refresh
on:
  push:
    branches: [feat/aurora-reservation-timeline-v1-20261114]
    paths: ['.github/workflows/aurora-timeline-one-off.yml']

permissions:
  contents: write

concurrency:
  group: aurora-timeline-source-media
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline Chromium and GIF encoder
        run: |
          python -m pip install -e '.[browser]'
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          command -v ffmpeg
      - name: Verify shared data and generated HTML are fresh
        run: |
          python scripts/generate_suite_demo.py --check
          python scripts/generate_hotel_ops_demo.py --check
          python scripts/generate_canonical_demo.py --check
          node --check demo/aurora-timeline.js
      - name: Capture and encode actual fictional offline browser
        run: |
          python scripts/capture_previews.py
          python scripts/build_promo_gifs.py
      - name: Validate all media hashes and timeline source
        run: |
          python -m unittest tests.test_showcase_media tests.test_aurora_timeline_contract -v
      - name: Commit verified media only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images/
          if ! git diff --cached --quiet; then
            git commit -m "docs(media): capture Aurora timeline and update true browser provenance"
            git push origin HEAD:feat/aurora-reservation-timeline-v1-20261114
          fi
